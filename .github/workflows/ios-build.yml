name: Build iOS IPA (Tauri Native)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: 1. Checkout codul real
        uses: actions/checkout@v4
        with:
          repository: 'zxcloli666/SoundCloud-Desktop'
          ref: 'main'

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Install pnpm
        run: npm install -g pnpm

      - name: 4. Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 5. Install Dependencies
        working-directory: ./desktop
        run: pnpm install

      - name: 6. Install Tauri CLI
        working-directory: ./desktop
        run: pnpm add -D @tauri-apps/cli

      - name: 7. Tauri iOS Init
        working-directory: ./desktop
        run: |
          echo "--- tauri ios init ---"
          npx tauri ios init

          echo "--- Continut src-tauri/gen/apple ---"
          find src-tauri/gen/apple -maxdepth 3

      - name: 8. Tauri iOS Build
        working-directory: ./desktop
        run: |
          npx tauri ios build --target aarch64

      - name: 9. Locate si Upload IPA
        run: |
          echo "--- Cautare fisiere .ipa ---"
          find desktop/src-tauri/gen/apple -name "*.ipa" -o -name "*.xcarchive"

      - name: 10. Upload IPA ca Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundCloud-iOS-IPA-Native
          path: |
            desktop/src-tauri/gen/apple/**/*.ipa
