name: Build iOS IPA (Tauri - Unsigned)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Install Tauri CLI
        working-directory: desktop
        run: pnpm exec tauri --version

      - name: Initialize Tauri iOS
        working-directory: desktop
        run: |
          pnpm exec tauri ios init

          echo "=== Generated Apple project ==="
          find src-tauri/gen/apple -maxdepth 3 \
            \( -name "*.xcodeproj" -o -name "*.xcworkspace" -o -name "Podfile" \) \
            -print

      - name: Install CocoaPods dependencies
        working-directory: desktop/src-tauri/gen/apple
        run: |
          if [ -f Podfile ]; then
            pod install
          else
            echo "No Podfile found"
          fi

      - name: Build iOS unsigned
        working-directory: desktop
        run: |
          pnpm exec tauri ios build \
            --target aarch64 \
            -- \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Find generated files
        run: |
          echo "=== IPA ==="
          find desktop -type f -name "*.ipa" -print 2>/dev/null || true

          echo "=== XCARCHIVE ==="
          find desktop -type d -name "*.xcarchive" -print 2>/dev/null || true

          echo "=== APP ==="
          find desktop -type d -name "*.app" -print 2>/dev/null || true

      - name: Collect build outputs
        run: |
          mkdir -p ios-artifacts

          find desktop -type f -name "*.ipa" \
            -exec cp {} ios-artifacts/ \; 2>/dev/null || true

          find desktop -type d -name "*.xcarchive" \
            -exec cp -R {} ios-artifacts/ \; 2>/dev/null || true

          find desktop -type d -name "*.app" \
            -exec cp -R {} ios-artifacts/ \; 2>/dev/null || true

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SoundCloud-iOS-unsigned
          path: ios-artifacts
          if-no-files-found: warn