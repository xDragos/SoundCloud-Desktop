name: Build iOS IPA (Tauri Native)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4
        with:
          repository: xDragos/SoundCloud-Desktop
          ref: main

      - name: 2. Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 3. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 4. Install pnpm
        run: |
          npm install -g pnpm@10.34.5
          echo "=== pnpm ==="
          which pnpm
          pnpm --version

      - name: 5. Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 6. Install dependencies
        working-directory: ./desktop
        run: |
          pnpm install --frozen-lockfile

      - name: 7. Check Tauri
        working-directory: ./desktop
        run: |
          pnpm exec tauri --version

      - name: 8. Initialize Tauri iOS
        working-directory: ./desktop
        run: |
          pnpm exec tauri ios init

          echo "=== Generated Apple project ==="

          find src-tauri/gen/apple -maxdepth 3 \
            \( \
              -name "*.xcodeproj" \
              -o -name "*.xcworkspace" \
              -o -name "Podfile" \
            \) \
            -print

      - name: 9. Install CocoaPods
        working-directory: ./desktop
        run: |
          cd src-tauri/gen/apple

          if [ -f Podfile ]; then
            echo "=== Installing CocoaPods dependencies ==="
            pod install
          else
            echo "No Podfile found"
          fi

      - name: 10. Build frontend
        working-directory: ./desktop
        run: |
          pnpm build

      - name: 11. Build iOS unsigned
        working-directory: ./desktop
        run: |
          pnpm exec tauri ios build \
            --target aarch64 \
            -- \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: 12. Find build outputs
        if: always()
        run: |
          echo "=== IPA ==="
          find desktop -type f -name "*.ipa" -print 2>/dev/null || true

          echo "=== XCARCHIVE ==="
          find desktop -type d -name "*.xcarchive" -print 2>/dev/null || true

          echo "=== APP ==="
          find desktop -type d -name "*.app" -print 2>/dev/null || true

      - name: 13. Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SoundCloud-iOS-Build
          path: |
            desktop/**/*.ipa
            desktop/**/*.xcarchive
            desktop/**/*.app
          if-no-files-found: warn
