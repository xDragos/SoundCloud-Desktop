name: Build iOS IPA (Fara Exceptii)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: 1. Checkout codul real
        uses: actions/checkout@v4
        with:
          repository: 'zxcloli666/SoundCloud-Desktop'
          ref: 'main'

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Install pnpm
        run: npm install -g pnpm

      - name: 4. Install Dependencies
        working-directory: ./desktop
        run: pnpm install

      - name: 5. Build Interfata (React/Vite)
        working-directory: ./desktop
        run: pnpm run build

      - name: 6. Injectare Bypass pentru Tauri
        working-directory: ./desktop
        run: |
          sed -i '' 's|<head>|<head><script>window.__TAURI_INTERNALS__={invoke:()=>Promise.resolve()};window.__TAURI__={invoke:()=>Promise.resolve()};</script>|' dist/index.html

      - name: 7. Integrare Capacitor pentru iOS
        working-directory: ./desktop
        run: |
          pnpm add @capacitor/core @capacitor/ios
          pnpm add -D @capacitor/cli

          echo "--- cap init ---"
          npx cap init "SoundCloud" "com.dragos.soundcloud" --web-dir dist

          echo "--- cap add ios ---"
          npx cap add ios

          echo "--- Continut desktop/ios dupa add ---"
          find ios -maxdepth 4

          echo "--- cap sync ios ---"
          npx cap sync ios

          echo "--- Continut desktop/ios/App dupa sync ---"
          ls -la ios/App/

      - name: 8. Compilare IPA nesemnat cu Xcode
        working-directory: ./desktop/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive -archivePath $PWD/build/App.xcarchive

          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qr SoundCloud-iOS.ipa Payload

      - name: 9. Upload IPA ca Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundCloud-iOS-IPA
          path: ./desktop/ios/App/SoundCloud-iOS.ipa
