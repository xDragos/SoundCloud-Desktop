name: Build iOS IPA (Tauri Native)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4
        with:
          repository: xDragos/SoundCloud-Desktop
          ref: main

      - name: 2. Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 3. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: 4. Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: 5. Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 6. Install dependencies
        working-directory: ./desktop
        run: pnpm install --frozen-lockfile

      - name: 7. Tauri iOS init
        working-directory: ./desktop
        run: |
          pnpm exec tauri ios init

          echo "=== Generated Apple project ==="
          find src-tauri/gen/apple -maxdepth 3 \
            \( -name "*.xcodeproj" -o -name "*.xcworkspace" -o -name "Podfile" \) \
            -print

      - name: 8. Disable automatic code signing
        working-directory: ./desktop
        run: |
          python3 - <<'PY'
          from pathlib import Path

          project = Path(
              "src-tauri/gen/apple/soundcloud-desktop.xcodeproj/project.pbxproj"
          )

          if not project.exists():
              raise SystemExit(f"Project not found: {project}")

          text = project.read_text()

          text = text.replace(
              "CODE_SIGN_STYLE = Automatic;",
              "CODE_SIGN_STYLE = Manual;"
          )

          project.write_text(text)

          print("Automatic code signing disabled.")
          PY

      - name: 9. Build frontend
        working-directory: ./desktop
        run: pnpm build

      - name: 10. Build iOS unsigned
        working-directory: ./desktop
        run: |
          xcodebuild \
            -project src-tauri/gen/apple/soundcloud-desktop.xcodeproj \
            -scheme soundcloud-desktop_iOS \
            -sdk iphoneos \
            -configuration release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM="" \
            build

      - name: 11. Find iOS build
        run: |
          echo "=== iOS build output ==="

          find desktop/src-tauri/gen/apple \
            -type f \
            \( -name "*.app" -o -name "*.ipa" -o -name "*.xcarchive" \) \
            -print || true

          find ~/Library/Developer/Xcode/DerivedData \
            -type d \
            -name "*.app" \
            -print 2>/dev/null || true

      - name: 12. Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SoundCloud-iOS-unsigned
          path: |
            desktop/src-tauri/gen/apple/**/*.app
            desktop/src-tauri/gen/apple/**/*.ipa
            desktop/src-tauri/gen/apple/**/*.xcarchive
          if-no-files-found: warn
