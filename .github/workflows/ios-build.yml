name: Build iOS IPA (Tauri Ad Hoc)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4
        with:
          repository: xDragos/SoundCloud-Desktop
          ref: main

      - name: 2. Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 3. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 4. Install pnpm
        run: |
          npm install -g pnpm@10.34.5
          pnpm --version

      - name: 5. Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 6. Install dependencies
        working-directory: ./desktop
        run: |
          pnpm install --frozen-lockfile

      - name: 7. Initialize Tauri iOS
        working-directory: ./desktop
        run: |
          pnpm exec tauri ios init

      - name: 8. Build frontend
        working-directory: ./desktop
        run: |
          pnpm build

      - name: 9. Install signing certificate and provisioning profile
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: |
          set -e

          echo "=== Creating temporary keychain ==="
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 20)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          echo "=== Importing P12 ==="
          CERT_PATH="$RUNNER_TEMP/signing.p12"
          echo "$IOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "=== Signing identities ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          echo "=== Installing provisioning profile ==="
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "$IOS_MOBILE_PROVISION" | base64 --decode > "$PROFILE_PATH"

          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST")
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$PROFILE_PLIST")

          echo "Profile name: $PROFILE_NAME"
          echo "Profile UUID: $PROFILE_UUID"
          echo "Application identifier: $APP_ID"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "=== Checking profile bundle identifier ==="
          if [[ "$APP_ID" != "29897MSSY7.app.star4684.aquila7560" ]]; then
            echo "ERROR: Provisioning profile does not match expected App ID."
            echo "Expected: 29897MSSY7.app.star4684.aquila7560"
            echo "Found:    $APP_ID"
            exit 1
          fi

          echo "=== Signing setup complete ==="

      - name: 10. Configure Xcode for Ad Hoc signing
        working-directory: ./desktop
        run: |
          set -e

          PROJECT="src-tauri/gen/apple/soundcloud-desktop.xcodeproj/project.pbxproj"

          echo "=== Patching bundle identifier ==="
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src-tauri/gen/apple/soundcloud-desktop.xcodeproj/project.pbxproj")
          s = p.read_text()

          s = s.replace(
              "PRODUCT_BUNDLE_IDENTIFIER = com.soundcloud.desktop;",
              "PRODUCT_BUNDLE_IDENTIFIER = app.star4684.aquila7560;"
          )

          s = s.replace(
              "PRODUCT_BUNDLE_IDENTIFIER = \"com.soundcloud.desktop\";",
              "PRODUCT_BUNDLE_IDENTIFIER = \"app.star4684.aquila7560\";"
          )

          p.write_text(s)
          PY

          echo "=== Setting manual signing ==="
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src-tauri/gen/apple/soundcloud-desktop.xcodeproj/project.pbxproj")
          s = p.read_text()

          replacements = {
              "CODE_SIGN_STYLE = Automatic;": "CODE_SIGN_STYLE = Manual;",
              "DEVELOPMENT_TEAM = 29897MSSY7;": "DEVELOPMENT_TEAM = 29897MSSY7;",
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          p.write_text(s)
          PY

          echo "=== Xcode signing settings ==="
          grep -nE \
            "PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER" \
            "$PROJECT" || true

      - name: 11. Build signed iOS IPA
        working-directory: ./desktop
        env:
          APPLE_DEVELOPMENT_TEAM: 29897MSSY7
        run: |
          set -e

          echo "=== Signing identities ==="
          security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain-db"

          echo "=== Building Ad Hoc IPA ==="

          pnpm exec tauri ios build \
            --target aarch64 \
            --export-method ad-hoc

      - name: 12. Find build outputs
        if: always()
        run: |
          echo "=== IPA ==="
          find desktop -type f -name "*.ipa" -print 2>/dev/null || true

          echo "=== XCARCHIVE ==="
          find desktop -type d -name "*.xcarchive" -print 2>/dev/null || true

          echo "=== APP ==="
          find desktop -type d -name "*.app" -print 2>/dev/null || true

      - name: 13. Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SoundCloud-iOS-AdHoc
          path: |
            desktop/**/*.ipa
            desktop/**/*.xcarchive
            desktop/**/*.app
          if-no-files-found: warn

      - name: 14. Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
