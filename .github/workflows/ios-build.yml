name: Build iOS IPA (Tauri Native)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: 1. Checkout codul real
        uses: actions/checkout@v4
        with:
          repository: 'zxcloli666/SoundCloud-Desktop'
          ref: 'main'

      - name: 1b. Selecteaza Xcode stabil recent
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Install pnpm
        run: npm install -g pnpm

      - name: 4. Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 5. Install Dependencies
        working-directory: ./desktop
        run: pnpm install

      - name: 6. Install Tauri CLI
        working-directory: ./desktop
        run: pnpm add -D @tauri-apps/cli

      - name: 7. Tauri iOS Init + Pods
        working-directory: ./desktop
        run: |
          npx tauri ios init
          
          echo "=== Structura generată ==="
          find src-tauri/gen/apple -maxdepth 3 -type d || true
          find src-tauri/gen/apple -name "*.xcworkspace" -o -name "*.xcodeproj" -o -name "project.yml" || true

          cd src-tauri/gen/apple
          if [ -f Podfile ]; then
            pod install
          fi

      - name: 8. Tauri iOS Build (unsigned)
        working-directory: ./desktop
        run: |
          npx tauri ios build --target aarch64 -- \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: 9. Locate IPA / xcarchive
        run: |
          echo "=== Căutare IPA / xcarchive ==="
          find desktop/src-tauri/gen/apple -type f \( -name "*.ipa" -o -name "*.xcarchive" \) 2>/dev/null || true
          find desktop -name "*.ipa" 2>/dev/null || true

      - name: 10. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundCloud-iOS-IPA
          path: |
            desktop/src-tauri/gen/apple/**/*.ipa
            desktop/src-tauri/gen/apple/**/*.xcarchive
          if-no-files-found: warn