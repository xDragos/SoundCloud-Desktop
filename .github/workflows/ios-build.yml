name: Build iOS IPA (Tauri - Unsigned)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Select stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 3. Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 4. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: 5. Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 6. Verify build environment
        run: |
          echo "=== Node ==="
          node --version

          echo "=== pnpm ==="
          pnpm --version

          echo "=== Rust ==="
          rustc --version
          cargo --version

          echo "=== Xcode ==="
          xcodebuild -version

          echo "=== macOS ==="
          sw_vers

      - name: 7. Install dependencies
        working-directory: desktop
        run: |
          pnpm install --frozen-lockfile

      - name: 8. Check Tauri CLI
        working-directory: desktop
        run: |
          pnpm exec tauri --version

      - name: 9. Initialize Tauri iOS
        working-directory: desktop
        run: |
          pnpm exec tauri ios init

          echo "=== Generated Apple project ==="

          find src-tauri/gen/apple -maxdepth 3 \
            \( \
              -name "*.xcodeproj" \
              -o -name "*.xcworkspace" \
              -o -name "Podfile" \
            \) \
            -print

      - name: 10. Verify iOS Xcode target
        working-directory: desktop/src-tauri/gen/apple
        run: |
          echo "=== Xcode schemes ==="
          xcodebuild -list \
            -project soundcloud-desktop.xcodeproj

          echo "=== iOS target ==="
          xcodebuild \
            -project soundcloud-desktop.xcodeproj \
            -scheme soundcloud-desktop_iOS \
            -showBuildSettings \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | grep -E "TARGET_NAME|PRODUCT_BUNDLE_IDENTIFIER|SDKROOT" \
            || true

      - name: 11. Show generated project structure
        working-directory: desktop
        run: |
          echo "=== src-tauri/gen/apple ==="

          find src-tauri/gen/apple \
            -maxdepth 4 \
            -print | head -300

      - name: 12. Build iOS unsigned
        working-directory: desktop
        run: |
          pnpm exec tauri ios build \
            --target aarch64 \
            -- \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: 13. Locate IPA
        run: |
          echo "=== IPA files ==="

          find desktop \
            -type f \
            -name "*.ipa" \
            -print 2>/dev/null || true

      - name: 14. Locate XCARCHIVE
        run: |
          echo "=== XCARCHIVE directories ==="

          find desktop \
            -type d \
            -name "*.xcarchive" \
            -print 2>/dev/null || true

      - name: 15. Locate APP
        run: |
          echo "=== APP directories ==="

          find desktop \
            -type d \
            -name "*.app" \
            -print 2>/dev/null || true

      - name: 16. Collect build outputs
        run: |
          rm -rf ios-artifacts
          mkdir -p ios-artifacts

          echo "=== Copying IPA files ==="

          find desktop \
            -type f \
            -name "*.ipa" \
            -exec cp {} ios-artifacts/ \; \
            2>/dev/null || true

          echo "=== Copying XCARCHIVE files ==="

          find desktop \
            -type d \
            -name "*.xcarchive" \
            -exec cp -R {} ios-artifacts/ \; \
            2>/dev/null || true

          echo "=== Copying APP files ==="

          find desktop \
            -type d \
            -name "*.app" \
            -exec cp -R {} ios-artifacts/ \; \
            2>/dev/null || true

          echo "=== Final artifacts ==="

          find ios-artifacts \
            -maxdepth 3 \
            -print

      - name: 17. Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SoundCloud-iOS-unsigned
          path: ios-artifacts
          if-no-files-found: warn
