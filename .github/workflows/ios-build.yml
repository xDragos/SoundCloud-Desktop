name: Build iOS IPA (Tauri Native - Manual Signing)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: 4. Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 5. Install frontend dependencies
        working-directory: ./desktop
        run: pnpm install

      - name: 6. Install Tauri CLI
        working-directory: ./desktop
        run: pnpm add -D @tauri-apps/cli@next

      - name: 7. Initialize Tauri iOS project if missing
        working-directory: ./desktop
        run: |
          if [ ! -d "src-tauri/gen/apple" ]; then
            pnpm exec tauri ios init
          fi

      - name: 8. Install system build tools via Homebrew
        run: brew install cmake ninja pkg-config

      - name: 9. Decode Apple Certificates
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: 10. Extract Provisioning Profile UUID & Name
        run: |
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          UUID=$(security cms -D -i $PP_PATH | plutil -extract UUID raw -)
          NAME=$(security cms -D -i $PP_PATH | plutil -extract Name raw -)
          echo "PROVISIONING_PROFILE_UUID=$UUID" >> $GITHUB_ENV
          echo "PROVISIONING_PROFILE_NAME=$NAME" >> $GITHUB_ENV

      - name: 11. Patch generated Xcode project safely via Python
        working-directory: ./desktop
        env:
          APPLE_DEVELOPMENT_TEAM: 29897MSSY7
          APP_BUNDLE_ID: app.star4684.aquila7560
        run: |
          set -e
          PROJECT="src-tauri/gen/apple/soundcloud-desktop.xcodeproj/project.pbxproj"

          python3 - "$PROJECT" "$APPLE_DEVELOPMENT_TEAM" "$APP_BUNDLE_ID" <<'PY'
          import sys
          from pathlib import Path

          project_path = Path(sys.argv[1])
          team = sys.argv[2]
          bundle_id = sys.argv[3]

          text = project_path.read_text(encoding="utf-8")
          lines = text.splitlines()
          out = []

          for line in lines:
              stripped = line.strip()

              if stripped.startswith("PRODUCT_BUNDLE_IDENTIFIER ="):
                  indent = line[:len(line) - len(line.lstrip())]
                  out.append(f'{indent}PRODUCT_BUNDLE_IDENTIFIER = {bundle_id};')
              elif stripped.startswith("CODE_SIGN_STYLE ="):
                  indent = line[:len(line) - len(line.lstrip())]
                  out.append(f'{indent}CODE_SIGN_STYLE = Manual;')
              elif stripped.startswith("DEVELOPMENT_TEAM ="):
                  indent = line[:len(line) - len(line.lstrip())]
                  out.append(f'{indent}DEVELOPMENT_TEAM = {team};')
              elif stripped.startswith("CODE_SIGNING_ALLOWED ="):
                  indent = line[:len(line) - len(line.lstrip())]
                  out.append(f'{indent}CODE_SIGNING_ALLOWED = NO;')
              elif "OTHER_LDFLAGS =" in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  out.append(f'{indent}OTHER_LDFLAGS = "$(inherited) -framework MediaPlayer -framework AVFoundation -framework CoreAudio -framework AudioToolbox";')
              else:
                  out.append(line)

          project_path.write_text("\n".join(out) + "\n", encoding="utf-8")
          PY

          echo "=== Patch Applied Successfully ==="

      - name: 12. Build web assets
        working-directory: ./desktop
        run: pnpm build

      - name: 13a. Build libopus for iOS ARM64
        run: |
          set -e
          OPUS_DIR="$GITHUB_WORKSPACE/opus-src"
          INSTALL_DIR="$GITHUB_WORKSPACE/opus-ios"

          git clone --depth 1 https://github.com/xiph/opus.git "$OPUS_DIR"
          cd "$OPUS_DIR"

          cmake -B build-ios \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_DIR" \
            -DBUILD_SHARED_LIBS=OFF \
            -DOPUS_BUILD_PROGRAMS=OFF \
            -DOPUS_BUILD_TESTING=OFF

          cmake --build build-ios --target install

          echo "OPUS_LIB_DIR=$INSTALL_DIR" >> $GITHUB_ENV

      - name: 13b. Verify libopus installation
        run: |
          ls -la "$OPUS_LIB_DIR/lib"
          ls -la "$OPUS_LIB_DIR/include/opus"

      - name: 14. Build iOS archive with Tauri without signing
        working-directory: ./desktop
        env:
          APPLE_DEVELOPMENT_TEAM: 29897MSSY7
          OPUS_NO_PKG: "1"
          OPUS_STATIC: "1"
          OPUS_LIB_DIR: "${{ env.OPUS_LIB_DIR }}"
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGN_IDENTITY: ""
          RUSTFLAGS: "-C link-arg=-framework -C link-arg=MediaPlayer -C link-arg=-framework -C link-arg=AVFoundation -C link-arg=-framework -C link-arg=CoreAudio -C link-arg=-framework -C link-arg=AudioToolbox"
        run: |
          set -e
          pnpm exec tauri ios build --ci --no-sign --archive-only

      - name: 15. Locate xcarchive
        run: |
          ARCHIVE_PATH=$(find ~/Library/Developer/Xcode/Archives -name "*.xcarchive" | head -n 1)
          if [ -z "$ARCHIVE_PATH" ]; then
            echo "Error: No xcarchive found!"
            exit 1
          fi
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> $GITHUB_ENV
          echo "Found archive at: $ARCHIVE_PATH"

      - name: 16. Export IPA manually via xcodebuild
        run: |
          set -e
          EXPORT_OPTIONS_PLIST=$RUNNER_TEMP/ExportOptions.plist

          cat <<EOF > $EXPORT_OPTIONS_PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>teamID</key>
              <string>29897MSSY7</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>app.star4684.aquila7560</key>
                  <string>${{ env.PROVISIONING_PROFILE_UUID }}</string>
              </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist $EXPORT_OPTIONS_PLIST \
            -exportPath $RUNNER_TEMP/output

      - name: 17. Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/output/*.ipa
